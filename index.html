<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KRD Stores – Kippa Ring Depot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00768C" />
  <meta name="description" content="Kippa Ring Depot Stores — log what you take, stocktakes and reorders." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="KRD Stores" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <header class="navbar" id="topbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand d-flex align-items-center gap-2 text-white text-decoration-none" href="#/">
        <img src="icons/mark.svg" alt="" width="34" height="34" />
        <span class="brand-text">
          <span class="brand-name">KRD STORES</span>
          <span class="brand-sub">Kippa Ring Depot Stores</span>
        </span>
      </a>
      <div id="topRight" class="d-flex align-items-center" style="gap:.25rem"></div>
    </div>
  </header>

  <div id="demoBanner" class="demo-banner d-none" role="status"></div>
  <div id="offlineBanner" class="offline-banner d-none" role="status"></div>

  <main id="app" class="container app-main" tabindex="-1" aria-live="polite">
    <div class="text-center py-5 text-muted">Loading…</div>
  </main>

  <nav id="bottomNav" class="bottom-nav d-none" aria-label="Main"></nav>

  <div id="sheetHost"></div>
  <div id="toastHost" class="toast-host" aria-live="assertive"></div>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
